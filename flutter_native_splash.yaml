flutter_native_splash:
  # Background color matching the app's brand gradient base
  color: "#F7F2F2"

  # Image displayed in the center of the splash screen
  image: assets/icon/splash_icon_padded.png

  android: true
  ios: true
  ios_content_mode: scaleAspectFit

  # Android 12+ themed splash
  android_12:
    color: "#F7F2F2"
    image: assets/icon/splash_icon_padded.png
    icon_background_color: "#F7F2F2"
